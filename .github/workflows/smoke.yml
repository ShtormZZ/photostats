name: smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is the target platform, Linux is there to catch path assumptions.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q scan.py app.py launcher.py version.py dupkey.py raw_pairs.py rescan.py tags.py jobs.py db_schema.py tools

      - name: License file
        run: python tools/check_license.py

      - name: Smoke test
        run: python tools/smoke_test.py

      - name: Database migrations and planner
        run: python tools/test_database.py

      - name: Timeline API filters and paging
        run: python tools/test_timeline.py

      - name: RAW and JPEG pairing
        run: python tools/test_raw_pairs.py

      - name: Folder reconciliation
        run: python tools/test_rescan.py

      - name: Timeline browser
        run: |
          python tools/timeline_browser_test.py --allow-skip
          python tools/timeline_browser_test.py --allow-skip --width 360
